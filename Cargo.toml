[workspace]
members = ["crates/toolrecall-domain", "crates/toolrecall-application", "crates/toolrecall-adapter-mcp", "crates/toolrecall-adapter-openai", "crates/toolrecall-adapter-ruvnet", "crates/toolrecall-evaluation"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
repository = "https://github.com/nicholas-ruest/toolrecall"

[workspace.dependencies]
anyhow = "1.0.103"
async-trait = "0.1.89"
clap = { version = "4.5.48", features = ["derive"] }
hex = "0.4.3"
rmcp = { version = "3.4.0", default-features = false }
ruvector-core = "2.3.1"
rvf-crypto = "0.2.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
tempfile = "3.23.0"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["macros", "process", "rt-multi-thread", "time"] }

[package]
name = "toolrecall"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Source-aware recall firewall for deferred agent tool catalogs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
serde_json.workspace = true
tokio.workspace = true
toolrecall-adapter-mcp = { version = "0.1.0", path = "crates/toolrecall-adapter-mcp" }
toolrecall-adapter-openai = { version = "0.1.0", path = "crates/toolrecall-adapter-openai" }
toolrecall-adapter-ruvnet = { version = "0.1.0", path = "crates/toolrecall-adapter-ruvnet" }
toolrecall-application = { version = "0.1.0", path = "crates/toolrecall-application" }
toolrecall-domain = { version = "0.1.0", path = "crates/toolrecall-domain" }

[[bin]]
name = "toolrecall"
path = "src/main.rs"
