[advisories]
version = 2
ignore = ["RUSTSEC-2025-0141"]

[bans]
multiple-versions = "allow"
wildcards = "deny"

[licenses]
version = 2
confidence-threshold = 0.8
allow = ["Apache-2.0", "MIT", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib", "MPL-2.0", "CDLA-Permissive-2.0"]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
