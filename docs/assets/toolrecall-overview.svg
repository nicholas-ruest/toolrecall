<svg xmlns="http://www.w3.org/2000/svg" width="980" height="260" viewBox="0 0 980 260" role="img" aria-labelledby="title desc">
  <title id="title">ToolRecall source-aware tool retrieval</title>
  <desc id="desc">Deferred tools pass through source-aware recall, MCP validation, RuVector storage and RVF evidence.</desc>
  <rect width="980" height="260" rx="24" fill="#0b1020"/>
  <g font-family="system-ui, sans-serif" text-anchor="middle">
    <text x="490" y="42" fill="#f8fafc" font-size="26" font-weight="700">ToolRecall</text>
    <g fill="#151d34" stroke="#5eead4" stroke-width="2">
      <rect x="35" y="90" width="165" height="90" rx="14"/>
      <rect x="225" y="90" width="165" height="90" rx="14"/>
      <rect x="415" y="90" width="165" height="90" rx="14"/>
      <rect x="605" y="90" width="165" height="90" rx="14"/>
      <rect x="795" y="90" width="150" height="90" rx="14"/>
    </g>
    <g fill="#e2e8f0" font-size="17" font-weight="600">
      <text x="117" y="128">Deferred tools</text><text x="117" y="153" font-size="13">OpenAI SDK</text>
