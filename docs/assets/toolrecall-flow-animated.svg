<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">ToolRecall execution and evidence flow</title>
  <desc id="desc">A query and source obligation are normalized, recalled, validated, persisted, witnessed, evaluated, and returned as a receipt without granting execution authority.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9z" fill="#6e93b8"/></marker>
    <style>
      .h{font:700 18px system-ui,-apple-system,Segoe UI,sans-serif;fill:#eaf4ff}.s{font:500 13px system-ui,-apple-system,Segoe UI,sans-serif;fill:#a7c5df}
      .edge{stroke:#6e93b8;stroke-width:3;fill:none;marker-end:url(#arrow)}
      .dot{fill:#5eead4;animation:move 6s linear infinite}.dot.b{animation-delay:-3s;fill:#a78bfa}
      .seal{animation:seal 2.8s ease-in-out infinite;transform-origin:965px 364px}
      @keyframes move{0%{offset-distance:0%;opacity:0}8%{opacity:1}92%{opacity:1}100%{offset-distance:100%;opacity:0}}
      @keyframes seal{0%,100%{opacity:.55;transform:scale(.96)}50%{opacity:1;transform:scale(1.04)}}
      @media (prefers-reduced-motion:reduce){.dot,.seal{animation:none}.dot{display:none}.seal{opacity:1}}
    </style>
  </defs>
  <rect width="1200" height="520" rx="26" fill="#08172c"/>
  <text x="54" y="60" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="30" font-weight="750" fill="#f7fbff">Execution and evidence flow</text>
  <text x="1146" y="58" text-anchor="end" class="s">deterministic • typed • advisory</text>
  <path id="route" d="M174 168H390H606H822V364H1038" class="edge"/>
  <circle r="7" class="dot" style="offset-path:path('M174 168H390H606H822V364H1038')"/>
  <circle r="7" class="dot b" style="offset-path:path('M174 168H390H606H822V364H1038')"/>
  <g transform="translate(54 112)"><rect width="220" height="112" rx="16" fill="#0d3155" stroke="#3b82f6"/><text x="110" y="44" text-anchor="middle" class="h">Input boundary</text><text x="110" y="72" text-anchor="middle" class="s">query + required sources</text><text x="110" y="93" text-anchor="middle" class="s">validated CLI values</text></g>
  <g transform="translate(326 112)"><rect width="220" height="112" rx="16" fill="#12334e" stroke="#5eead4"/><text x="110" y="44" text-anchor="middle" class="h">Recall policy</text><text x="110" y="72" text-anchor="middle" class="s">global top-k</text><text x="110" y="93" text-anchor="middle" class="s">source guard / full catalog</text></g>
  <g transform="translate(598 112)"><rect width="220" height="112" rx="16" fill="#182f50" stroke="#a78bfa"/><text x="110" y="44" text-anchor="middle" class="h">MCP adapter</text><text x="110" y="72" text-anchor="middle" class="s">official Rust model</text><text x="110" y="93" text-anchor="middle" class="s">schema validation</text></g>
  <g transform="translate(870 112)"><rect width="220" height="112" rx="16" fill="#1e304c" stroke="#f59e0b"/><text x="110" y="44" text-anchor="middle" class="h">Outcome memory</text><text x="110" y="72" text-anchor="middle" class="s">RuVector insert</text><text x="110" y="93" text-anchor="middle" class="s">readback assertion</text></g>
  <g transform="translate(598 308)"><rect width="220" height="112" rx="16" fill="#172d50" stroke="#a78bfa"/><text x="110" y="44" text-anchor="middle" class="h">Bounded evaluation</text><text x="110" y="72" text-anchor="middle" class="s">Darwin scoring</text><text x="110" y="93" text-anchor="middle" class="s">Flywheel replay</text></g>
  <g class="seal" transform="translate(870 308)"><rect width="220" height="112" rx="16" fill="#243047" stroke="#f59e0b"/><text x="110" y="44" text-anchor="middle" class="h">Receipt + witness</text><text x="110" y="72" text-anchor="middle" class="s">catalog + decision digests</text><text x="110" y="93" text-anchor="middle" class="s">authority: none</text></g>
  <path d="M980 224V278H708V308" class="edge"/>
  <path d="M818 364H870" class="edge"/>
  <g transform="translate(54 466)"><rect width="1092" height="1" fill="#294866"/><text y="32" class="s">Failure paths: invalid policy • timeout • malformed sidecar • MCP validation failure • RuVector readback failure • witness mismatch</text></g>
</svg>
